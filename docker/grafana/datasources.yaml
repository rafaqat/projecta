# Grafana datasources for the local stack. This file REPLACES the one baked into the otel-lgtm
# image (docker/compose.yml mounts it over the image's copy), so it must keep every datasource the
# image provides: Grafana drops any it no longer sees, and the dashboards reference all of them by
# uid. The only change from the image's version is the Tempo `spanBar` block below.
#
# The image is pinned by digest, so this copy cannot drift silently; a digest bump is the moment to
# diff it against the image's own file again.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: true
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        customQuery: true
        datasourceUid: "loki"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"

      serviceMap:
        datasourceUid: "prometheus"
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "loki"

      # Label every span bar in the waterfall with the tool it ran, so the agent loop is legible
      # without opening each span. Spans without the attribute show nothing, which is what makes
      # the tool calls stand out from the rest of the trace.
      spanBar:
        type: "Tag"
        tag: "app.tool.name"

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "tempo"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040
