# Forward proxy for web and worker (ADR-019, SEC-03). Only allowlisted git
# hosts and the identity provider, only over CONNECT to 443 — and, ADR-040,
# the model server on the host (host.docker.internal:8765): Node's proxy
# agent tunnels it with CONNECT like any other destination, so that one
# host and port are the only CONNECT target outside 443. It is this machine,
# and the `internal` network has no other route to it.
http_port 3128
# Names come from the resolver, not /etc/hosts: Docker Desktop writes an IPv6 entry for the host
# there that Squid would try first and fail on; the resolver answers IPv4 for host.docker.internal.
hosts_file none
dns_v4_first on
acl allowed_hosts dstdomain github.com api.github.com codeload.github.com objects.githubusercontent.com raw.githubusercontent.com login.microsoftonline.com registry.npmjs.org
acl model_server dstdomain host.docker.internal
acl model_server_port port 8765
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT model_server model_server_port
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all
access_log stdio:/var/log/squid/access.log
cache deny all
