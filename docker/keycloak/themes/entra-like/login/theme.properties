# Local login theme (docker only): the keycloak.v2 markup restyled to read like
# an enterprise identity-provider sign-in page (centred card, underline inputs,
# right-aligned primary action). No third-party branding; the realm's own
# display name is the brand. Resources fall back to keycloak.v2.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/entra.css
darkMode=false
