# OpenTelemetry Collector with redaction (ADR-023, SEC-14). The SDK already
# reduces attributes to the allowlist; this is the second, independent stage.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  redaction:
    allow_all_keys: false
    allowed_keys:
      - user.id
      - app.actor.kind
      - app.job
      - app.request.id
      - app.workspace.id
      - http.request.method
      - http.response.status_code
      - http.route
      - server.address
      - server.port
      - network.protocol.version
      - db.system.name
      - db.operation.name
      - db.namespace
      - error.type
      - app.content.kind
      - app.error.code
      - app.error.cause
      - app.error.hash
      # `gen_ai.provider.name` was removed: the gateway's route table selects the provider, so the
      # application cannot write it. The cache counts are separate from input_tokens rather than
      # inside it, and `complete` says whether a round's counts are the whole story.
      - gen_ai.conversation.id
      - gen_ai.request.model
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.usage.cache_read_input_tokens
      - gen_ai.usage.cache_creation_input_tokens
      - gen_ai.usage.complete
      - app.policy.decision
      - app.policy.rule
      - app.scope.label
      - app.scope.stage
      - app.scope.rule_id
      # The turn's own spans (app/security/telemetry/spans.ts): counts, labels and statuses.
      - app.turn.run_handle
      - app.turn.commit
      - app.turn.scope_label
      - app.turn.run_state
      - app.turn.reason
      - app.turn.released
      - app.turn.citations
      - app.turn.withheld_count
      - app.retrieval.seed_source
      - app.retrieval.status
      - app.retrieval.seeds
      - app.retrieval.items
      - app.retrieval.chunks
      - app.agent.round
      - app.agent.tools_requested
      - app.agent.stop_reason
      - app.agent.iterations
      - app.tool.name
      - app.tool.status
      - app.model.system_prompt
      - app.gate.mechanism
      # Content does not ride span attributes: Tempo truncates one at 2048 bytes, so a question or
      # a request array arrived as its first 2 KB. It rides a log record's body instead
      # (app/security/telemetry/content_log.ts), labelled `app.content.kind` above. Note that
      # allowlisting that label does not gate the prose: this allowlist governs attributes, and a
      # body is not an attribute. `filter/content` below is what gates it.
      - app.security.event
      - app.security.severity
      - app.repository.id
      - app.ingest.ref
      - app.ingest.trigger
      - app.ingest.state
      - app.ingest.step
      - app.run.state
      - app.gate.released
      - url.scheme
      - service.name
      - service.version
      - deployment.environment
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
    blocked_values:
      - "(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}"
      - "sk-ant-[A-Za-z0-9_-]{20,}"
      - "gh[pousr]_[A-Za-z0-9]{36,}"
      - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    summary: info
  # THE THIRD KEY, held outside the application (ADR-0025).
  #
  # Content used to be a span attribute, and the allowlist above could therefore withhold it: the
  # content was the attribute. Content is now a log record's body, and the allowlist governs
  # attributes only, so it cannot withhold prose. This processor replaces that control.
  #
  # Unset means drop. A deployed collector that configures nothing is the safe one, which is the
  # direction the old control ran in and the reason for stating it this way rather than asking a
  # deployment to add a stripping processor it could forget. The variable is deliberately not
  # TELEMETRY_DEBUG_CONTENT: two different names in two different processes mean no single
  # `export` opens both, which is the property ADR-0023 wanted from a key it held over here.
  filter/content:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["app.content.kind"] != nil and "${env:OTEL_ALLOW_CONTENT_LOGS:-}" != "1"'
  batch:
    timeout: 1s

exporters:
  otlp_grpc/lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  file:
    path: /var/lib/otel/traces.jsonl
    flush_interval: 1s
  file/logs:
    path: /var/lib/otel/logs.jsonl
    flush_interval: 1s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/lgtm, file]
    # Logs (pino through the OpenTelemetry bridge, security events included) pass the same
    # redaction and land in Loki beside the traces, correlated by trace id and request id.
    logs:
      receivers: [otlp]
      processors: [filter/content, redaction, batch]
      exporters: [otlp_grpc/lgtm, file/logs]
    # Metrics: RED from the HTTP instrumentation and the application's counters, into Prometheus.
    metrics:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/lgtm]
