# OpenTelemetry Collector with redaction (ADR-023, SEC-14). The SDK already
# reduces attributes to the allowlist; this is the second, independent stage.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  redaction:
    allow_all_keys: false
    allowed_keys:
      - user.id
      - app.actor.kind
      - app.job
      - app.request.id
      - app.workspace.id
      - http.request.method
      - http.response.status_code
      - http.route
      - server.address
      - server.port
      - network.protocol.version
      - db.system.name
      - db.operation.name
      - db.namespace
      - error.type
      - app.content.kind
      - app.error.code
      - app.error.cause
      - app.error.hash
      - gen_ai.conversation.id
      - gen_ai.provider.name
      - gen_ai.request.model
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - app.policy.decision
      - app.policy.rule
      - app.scope.label
      - app.scope.stage
      - app.scope.rule_id
      # The turn's own spans (app/security/telemetry/spans.ts): counts, labels and statuses.
      - app.turn.run_handle
      - app.turn.commit
      - app.turn.scope_label
      - app.turn.run_state
      - app.turn.reason
      - app.turn.released
      - app.turn.citations
      - app.turn.withheld_count
      - app.retrieval.seed_source
      - app.retrieval.status
      - app.retrieval.seeds
      - app.retrieval.items
      - app.retrieval.chunks
      - app.agent.round
      - app.agent.tools_requested
      - app.agent.stop_reason
      - app.agent.iterations
      - app.tool.name
      - app.tool.status
      - app.model.system_prompt
      - app.gate.mechanism
      # Content does not ride span attributes: Tempo truncates one at 2048 bytes, so a question or
      # a request array arrived as its first 2 KB. It rides a log record's body instead
      # (app/security/telemetry/content_log.ts), which this label names and which the application
      # writes only when APP_ENV is local or test AND TELEMETRY_DEBUG_CONTENT=1. A deployed
      # collector need not carry `app.content.kind`; without it the records lose their label.
      - app.security.event
      - app.security.severity
      - app.repository.id
      - app.ingest.ref
      - app.ingest.trigger
      - app.ingest.state
      - app.ingest.step
      - app.run.state
      - app.gate.released
      - url.scheme
      - service.name
      - service.version
      - deployment.environment
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
    blocked_values:
      - "(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}"
      - "sk-ant-[A-Za-z0-9_-]{20,}"
      - "gh[pousr]_[A-Za-z0-9]{36,}"
      - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    summary: info
  batch:
    timeout: 1s

exporters:
  otlp_grpc/lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  file:
    path: /var/lib/otel/traces.jsonl
    flush_interval: 1s
  file/logs:
    path: /var/lib/otel/logs.jsonl
    flush_interval: 1s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/lgtm, file]
    # Logs (pino through the OpenTelemetry bridge, security events included) pass the same
    # redaction and land in Loki beside the traces, correlated by trace id and request id.
    logs:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/lgtm, file/logs]
    # Metrics: RED from the HTTP instrumentation and the application's counters, into Prometheus.
    metrics:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/lgtm]
