server=/otel-collector/127.0.0.11
server=/otel-lgtm/127.0.0.11
server=/azurite/127.0.0.11
server=/mock-oidc/127.0.0.11
server=/keycloak/127.0.0.11
server=/squid/127.0.0.11
server=/web/127.0.0.11
server=/worker/127.0.0.11
server=/audit-writer/127.0.0.11
server=/provider-stub/127.0.0.11
server=/git-fixture/127.0.0.11
