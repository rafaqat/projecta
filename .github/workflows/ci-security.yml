name: ci-security

# The dynamic security testing (the real "DAST" beyond ZAP): the structural red-team regression
# with ablations (make redteam), plus the authz/IDOR, honeytoken/exfil, adversarial and benign
# suites. Deterministic and key-free — the red-team runner uses the scripted model seam and builds
# its encoded payloads into a temp dir at test time; the --live lane (real gateway) is not run here.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  INJECTION_DETECTOR_MODEL: protectai/deberta-v3-base-prompt-injection-v2
  ANTHROPIC_BASE_URL: http://127.0.0.1:8787
  LLM_GATEWAY_TOKEN: test-gateway-token
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redteam:
    name: security — red-team regression + authz/IDOR + honeytoken + adversarial + benign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: development
      HOST: localhost
      PORT: '4444'
      LOG_LEVEL: info
      APP_KEY: ${{ github.sha }} # boot only; nothing is encrypted with it here
      APP_URL: http://localhost:4444
      APP_ENV: test
      APP_NAME: projectA
      APP_VERSION: 0.0.0
      OIDC_ISSUER: http://127.0.0.1:9100
      OIDC_ALLOWED_ISSUERS: http://127.0.0.1:9100
      OIDC_CLIENT_ID: projectA
      OIDC_CLIENT_SECRET: test-client-secret
      OIDC_ALLOWED_TENANTS: tenant-local
      SESSION_DRIVER: database
      GIT_ALLOWED_HOSTS: localhost:8443
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: app
      DB_PASSWORD: app
      DB_DATABASE: app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      - name: Build + start Postgres (pgvector + pg_textsearch)
        run: |
          docker build --build-arg TARGETARCH=amd64 -f docker/postgres/Dockerfile -t pa-postgres:ci .
          docker run -d --name pgts -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app -p 5432:5432 pa-postgres:ci
      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            PGPASSWORD=postgres pg_isready -h localhost -U postgres -d app >/dev/null 2>&1 \
              && PGPASSWORD=postgres psql -h localhost -U postgres -d app_test -c 'select 1' >/dev/null 2>&1 \
              && { echo ready; exit 0; }
            sleep 2
          done
          docker logs pgts; exit 1
      - name: Cache pinned weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: models-${{ hashFiles('models.lock.json') }}
      - name: Fetch pinned weights (ONNX; the ingest-backed security tests embed)
        run: MODELS_RUNTIME=onnx node scripts/fetch-models.mjs
      - name: Migrations run as the app role
        run: node ace.js migration:run --force
      - name: Structural red-team regression with ablations (make redteam)
        env:
          DB_DATABASE: app_test
        run: node ace.js redteam:run
      - name: Authz / IDOR + honeytoken + adversarial + benign suites
        env:
          DB_DATABASE: app_test
          # Correlate each test to the security events it provoked (case -> events), for the artifact below.
          SECURITY_EVENTS_REPORT_PATH: redteam-security-events.jsonl
        # `pipefail` is set before the pipe: without it `tee` would return success and a failing
        # suite would pass. The log is kept so the step can report how often the BM25 index faulted
        # and retrieval was answered from the tsvector column instead — silent by design, so unless
        # it is counted the degradation is invisible (timescale/pg_textsearch#515).
        run: |
          set -euo pipefail
          node test.js functional \
            --files 'authz/*' \
            --files 'security/*' \
            --files 'redteam/*' \
            --files 'benign/*' 2>&1 | tee suite.log
      - name: Report how often lexical retrieval degraded
        if: always()
        run: |
          set -uo pipefail
          faults=$(grep -c 'lexical index faulted' suite.log || true)
          {
            echo "### Lexical retrieval"
            echo
            echo "BM25 index faults in this run: **${faults}**"
            if [ "${faults}" -gt 0 ]; then
              echo
              echo "Each one answered that query from the tsvector column instead. Routines:"
              echo
              grep -A6 'lexical index faulted' suite.log \
                | grep -oE 'routine[^,}]*' | sort | uniq -c | sed 's/^/    /' || true
              echo
              echo "Tracked upstream: timescale/pg_textsearch#515"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the red-team security-event log (case -> events)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: redteam-security-events
          path: redteam-security-events.jsonl
          if-no-files-found: ignore
      - name: Red-team unit checks (differential, live-aggregate)
        env:
          DB_DATABASE: app_test
        run: node test.js unit --files 'redteam/*' --files 'security/*'
