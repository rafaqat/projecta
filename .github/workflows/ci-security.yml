name: ci-security

# The dynamic security testing (the real "DAST" beyond ZAP): the structural red-team regression
# with ablations (make redteam), plus the authz/IDOR, honeytoken/exfil, adversarial and benign
# suites. Deterministic and key-free — the red-team runner uses the scripted model seam and builds
# its encoded payloads into a temp dir at test time; the --live lane (real gateway) is not run here.
on:
  push:
  pull_request:

env:
  INJECTION_DETECTOR_MODEL: protectai/deberta-v3-base-prompt-injection-v2
  ANTHROPIC_BASE_URL: http://127.0.0.1:8787
  LLM_GATEWAY_TOKEN: test-gateway-token
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redteam:
    name: security — red-team regression + authz/IDOR + honeytoken + adversarial + benign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: development
      HOST: localhost
      PORT: '4444'
      LOG_LEVEL: info
      APP_KEY: ${{ github.sha }} # boot only; nothing is encrypted with it here
      APP_URL: http://localhost:4444
      APP_ENV: test
      APP_NAME: projectA
      APP_VERSION: 0.0.0
      OIDC_ISSUER: http://127.0.0.1:9100
      OIDC_ALLOWED_ISSUERS: http://127.0.0.1:9100
      OIDC_CLIENT_ID: projectA
      OIDC_CLIENT_SECRET: test-client-secret
      OIDC_ALLOWED_TENANTS: tenant-local
      SESSION_DRIVER: database
      GIT_ALLOWED_HOSTS: localhost:8443
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: app
      DB_PASSWORD: app
      DB_DATABASE: app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci
      - name: Build + start Postgres (pgvector + pg_textsearch)
        run: |
          docker build --build-arg TARGETARCH=amd64 -f docker/postgres/Dockerfile -t pa-postgres:ci .
          docker run -d --name pgts -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app -p 5432:5432 pa-postgres:ci
      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            PGPASSWORD=postgres pg_isready -h localhost -U postgres -d app >/dev/null 2>&1 \
              && PGPASSWORD=postgres psql -h localhost -U postgres -d app_test -c 'select 1' >/dev/null 2>&1 \
              && { echo ready; exit 0; }
            sleep 2
          done
          docker logs pgts; exit 1
      - name: Cache pinned weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: models-${{ hashFiles('models.lock.json') }}
      - name: Fetch pinned weights (ONNX; the ingest-backed security tests embed)
        run: MODELS_RUNTIME=onnx node scripts/fetch-models.mjs
      - name: Migrations run as the app role
        run: node ace.js migration:run --force
      - name: Structural red-team regression with ablations (make redteam)
        env:
          DB_DATABASE: app_test
        run: node ace.js redteam:run
      - name: Authz / IDOR + honeytoken + adversarial + benign suites
        env:
          DB_DATABASE: app_test
        run: >-
          node test.js --suite functional
          --files authz
          --files security
          --files redteam
          --files benign
      - name: Red-team unit checks (differential, live-aggregate)
        env:
          DB_DATABASE: app_test
        run: node test.js --suite unit --files redteam
