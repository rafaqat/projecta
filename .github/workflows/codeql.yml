name: codeql

# Deeper data-flow SAST (injection, XSS, path traversal, taint) over the TypeScript/JS surface.
# Complements the Semgrep custom rules in ci-scan; results land in the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1' # weekly, to catch newly-published queries

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — javascript-typescript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: /language:javascript-typescript
